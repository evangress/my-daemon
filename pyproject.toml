[project]
name = "my-daemon"
version = "0.1.0"
description = "Personal knowledge and memory system over an Obsidian vault — vector seeds, graph expansion, LLM synthesis."
authors = [{ name = "Evan Gress", email = "gress.evan@gmail.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "langchain-text-splitters>=0.2",
    "sentence-transformers>=2.7",
    "qdrant-client>=1.9",
    "networkx>=3.3",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "nicegui>=2.0",
    "pywebview>=5.0",
    "fastembed>=0.4",
    # Theme clustering (M-mem-7). Both BSD-3-Clause, Apache-2.0 compatible.
    # Present transitively via sentence-transformers; declared so the
    # dependency is intentional rather than incidental.
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # Vault watching for `daemon run` (MIT — Category A, Apache-2.0 compatible;
    # verified with `python scripts/license_check.py`). Present transitively via
    # nicegui; declared so the dependency is intentional rather than incidental.
    "watchfiles>=0.21",
    # OS-native credential storage for ANTHROPIC_API_KEY (MIT — Category A,
    # Apache-2.0 compatible; verified with `python scripts/license_check.py`).
    # Windows Credential Manager / macOS Keychain / Linux Secret Service, so
    # the key is never written to disk in plaintext by this project.
    "keyring>=25.0",
    "pytest>=9.0.3",
    "mkdocs>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # Typeshed stub distributions (Apache-2.0 — the typeshed licence — so
    # Category A and compatible with this project's Apache-2.0). Type-check
    # time only; never imported at runtime.
    "types-networkx>=3.3",
    "types-PyYAML>=6.0",
    # Makes CLAUDE.md rule 10 self-enforcing rather than a habit:
    # `python scripts/license_check.py` could not run without a manual install,
    # so debug/license-compliance.md had drifted since 2026-05-17. MIT — Category
    # A, Apache-2.0 compatible. Audit time only; never imported at runtime.
    "pip-licenses>=5.0",
]

[project.scripts]
daemon = "my_daemon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_daemon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
# A hard CI gate over the package only — tests and scripts are deliberately
# out of scope for now. Strictness is tuned for an existing codebase: bodies
# are checked everywhere (`check_untyped_defs`) so a wrong keyword argument is
# caught even inside an unannotated helper, but missing annotations are not
# themselves errors yet.
python_version = "3.11"
files = ["src/my_daemon"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true

# Third-party packages that ship neither inline types nor a stub distribution.
# Scoped per module on purpose: a blanket `ignore_missing_imports` would also
# swallow a genuine typo in a first-party import.
[[tool.mypy.overrides]]
module = [
    "frontmatter",
    "sklearn.*",
    # `scipy.optimize.linear_sum_assignment`, used for optimal theme matching.
    # Stubs exist (`scipy-stubs`) but pulling a stubs package for one call
    # signature is not worth the dependency; scoped here like sklearn.
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so tests can import `scripts.bootstrap` — the Windows installer lives
# outside the package on purpose (it runs before the package exists on disk).
pythonpath = ["src", "."]
