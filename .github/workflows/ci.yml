# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = documented floor; 3.12 = recommended daily-driver band.
        # The local dev venv runs newer; the heavy ML wheels (torch,
        # sentence-transformers) are the reason the matrix stops at 3.12.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Run tests
        run: uv run pytest -q

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/my_daemon
