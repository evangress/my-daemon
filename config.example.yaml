vault:
  path: ~/Documents/Obsidian/MyVault
  # `Agent` is the folder the writeback jobs own; exclude it from ingest so
  # the daemon doesn't read its own memory files back in.
  exclude_dirs: [".obsidian", ".trash", "templates", "Agent"]

chunking:
  max_tokens: 512
  overlap_tokens: 50
  split_on_headers: ["#", "##", "###"]

embeddings:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  device: auto  # auto | cpu | cuda | mps
  cache_folder: ./data/models   # model files live here; first run downloads, later runs are offline
  # Hybrid retrieval: fuse a BM25-style sparse signal with the dense one server-side in Qdrant.
  # Flip to false to A/B against dense-only. Switching modes requires `daemon ingest --full`.
  hybrid: false
  sparse_model: Qdrant/bm42-all-minilm-l6-v2-attentions

vector_store:
  backend: qdrant
  qdrant:
    url: http://localhost:6333
    collection: chunks

graph:
  path: ./data/graph.gpickle
  manifest_path: ./data/manifest.json
  expansion_depth: 2
  distance_decay: 0.5

retrieval:
  seed_top_k: 8
  context_token_budget: 6000
  candidate_pool: 3   # always surface at least N candidates to the user

llm:
  provider: anthropic
  # Sonnet 4.6 is the cost/quality sweet spot for personal RAG synthesis.
  # Alternatives: claude-opus-4-7 (highest fidelity, ~5x cost), claude-haiku-4-5 (fastest, lowest cost).
  model: claude-sonnet-4-6
  max_tokens: 2048
  # Opus 4.7 and other reasoning-capable models reject `temperature`. Leave it
  # unset (null) for those; set a float (e.g. 0.3) for Sonnet/Haiku if desired.
  temperature: null
  # Background-agent jobs (extract / link / reflect) use this cheaper model.
  # Leave null to reuse `model` above; default Haiku 4.5 is ~15x cheaper than Opus.
  batch_model: claude-haiku-4-5

agent:
  # Master switch. Start in dry-run mode (daemon link --dry-run, daemon extract --note <one>)
  # to verify thresholds against your vault, then flip to true.
  enabled: true
  folder_name: Agent
  # Linker thresholds. The auto-apply gate is intentionally strict: cosine >= 0.85
  # AND the target's title must appear verbatim (case-insensitive) in the source body.
  # Everything between suggest and apply thresholds lands in Agent/link-suggestions-*.md.
  link_apply_cosine: 0.85
  link_apply_requires_title_substring: true
  link_suggest_cosine: 0.78
  link_max_per_note: 5
  tag_apply_min_neighbor_count: 4
  # Extractor.
  extract_min_word_count: 80
  extract_skip_if_processed_within_hours: 18
  # Reflection: which themes to maintain in Agent/memory-*.md.
  reflect_themes: [personality, projects, relationships, themes]
  reflect_lookback_days: 7
  # Don't touch a note that was saved within this many minutes (avoid collisions).
  write_grace_minutes: 30

feedback:
  db_path: ./data/feedback.db

snapshot:
  # Bundles produced by `daemon snapshot create` land here. Each bundle freezes
  # the vector + graph + feedback state so the M3 analyzer and M4 observer LLM
  # can read a stable copy without contaminating live retrieval.
  dir: ./data/snapshots
  # `daemon snapshot prune` deletes bundles older than this; uncalled snapshots
  # never expire on their own.
  retention_days: 14

logging:
  level: INFO
